server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck endpoint for Docker / K8s
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Proxy /api/* to backend service (docker-compose service name: "api").
    # Both services are on the same compose default network so Docker's
    # embedded DNS resolves "api" at nginx startup. depends_on: api in
    # compose also guarantees api container starts first.
    #
    # Trailing slash on proxy_pass strips the /api/ location prefix:
    #   /api/actuator/health  ->  http://api:8080/actuator/health
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # React Router: serve index.html for any non-file route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}