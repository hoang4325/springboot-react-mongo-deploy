services:
  database:
    image: mongo:5.0
    container_name: "database"
    ports:
      - 27017:27017
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: spring-boot-student-app-api
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - MONGO_URL=mongodb://database:27017/dev
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: react-student-management
      dockerfile: Dockerfile
      args:
        # Embedded into the static bundle at build time.
        # Relative path so nginx can proxy /api/* to the api service.
        REACT_APP_API_URL: /api
    depends_on:
      - api
    ports:
      - "3000:80"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus